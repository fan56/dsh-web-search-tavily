# CI: typecheck + tests + a real-host boot smoke on every push to main, every
# pull request, and a daily schedule.
#
# The dsh CLI version is resolved at runtime from the npm registry's rolling
# rc/stable line — the newest of the `latest` (stable) and `next` (rc)
# dist-tags, never hand-pinned (the rc.8 lesson: a hand-pinned version went
# stale and rotted the gate) and never alpha (the alpha line is retired per
# the 2026-09-03 policy). scripts/link-dsh-closure.mjs re-points
# node_modules/@deepseek-ai/* at that install's closure, so
# typecheck runs against exactly the code the host ships (one
# @deepseek-ai/cordis in the type graph). The smoke boots a scratch profile
# with the plugin mounted via the real dsh CLI (scripts/smoke-boot.mjs) so
# "loads under real cordis" is a gate, not a hope.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily 03:51 UTC — catches upstream dsh rc/stable drift without hand-pinning.
    - cron: '51 3 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Check & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # The shipped engines floor plus current LTS.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install dsh CLI (rolling rc/stable line — newest of latest/next, never alpha)
        run: |
          # Policy (2026-09-03): the alpha line is retired for CI. Resolve the
          # newest of the `latest` (stable) and `next` (rc) dist-tags at
          # runtime, never hand-pinned — when a stable 0.1.2+ lands on
          # `latest` it wins over the rc by plain semver compare.
          STABLE="$(npm view @deepseek-ai/dsh@latest version)"
          RC="$(npm view @deepseek-ai/dsh@next version 2>/dev/null || true)"
          DSH_VERSION="$STABLE"
          if [ -n "$RC" ] && [ "$(printf '%s\n' "$STABLE" "$RC" | sort -V | tail -1)" = "$RC" ]; then
            DSH_VERSION="$RC"
          fi
          echo "dsh closure: ${DSH_VERSION}"
          npm install -g "@deepseek-ai/dsh@${DSH_VERSION}" --no-audit --no-fund

      # Point node_modules/@deepseek-ai/* at the installed CLI's closure so
      # tsc sees exactly the type graph the host runs (one cordis instance).
      - name: Link dsh closure types
        run: node scripts/link-dsh-closure.mjs

      - name: Check
        run: npm run check --if-present

      - name: Test
        run: npm test

      # dsh 的 profile/bundle 机器会转壳调用 pnpm 来初始化 scratch profile。
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Boot smoke (real dsh host, scratch profile)
        run: npm run smoke
